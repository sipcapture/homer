# Homer HEP UDP ingest — raise socket buffer ceilings and NIC backlog.
# Install: sudo cp 99-homer-udp-buffers.conf /etc/sysctl.d/ && sudo sysctl --system
#
# Matches src/utils/sysctl Recommended* constants and homer.json
# server_settings.udp_server.socket_recv_buffer (default 8 MiB).

net.core.rmem_max = 33554432
net.core.rmem_default = 8388608
net.core.wmem_max = 33554432
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 250000
