openapi: 3.0.3
info:
  title: Homer Next-Gen API
  version: "4.0.2-draft"
  description: >
    Draft Next-Gen REST API specification for the new homer-core.
servers:
  - url: "{apiPrefix}/api/v4"
    variables:
      apiPrefix:
        default: ""
        description: Optional API prefix (for example, /homer)
tags:
  - name: Auth
  - name: Users
  - name: Transactions
  - name: Exports
  - name: Imports
  - name: Dashboards
  - name: Mappings
  - name: Hepsub
  - name: Aliases
  - name: Tokens
  - name: Agents
  - name: Settings
  - name: Statistics
  - name: Metrics
  - name: Logs
  - name: Integrations
  - name: System
  - name: Stream
security:
  - bearerAuth: []
paths:
  /auth/sessions:
    post:
      tags: [Auth]
      summary: Create session (login)
      operationId: authSessionCreate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Close session (logout)
      operationId: authSessionDelete
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/providers:
    get:
      tags: [Auth]
      summary: List authentication providers (internal, optional LDAP, at most one OAuth2)
      operationId: authProvidersList
      security: []
      responses:
        "200":
          description: Providers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/oauth2/{provider}/redirect:
    get:
      tags: [Auth]
      summary: OAuth2 redirect
      operationId: authOauth2Redirect
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "302":
          description: Redirect to provider
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/oauth2/{provider}/callback:
    get:
      tags: [Auth]
      summary: OAuth2 callback
      operationId: authOauth2Callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "302":
          description: Redirect after callback
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/oauth2/token:
    post:
      tags: [Auth]
      summary: Exchange one-time token for JWT
      operationId: authOauth2TokenExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2TokenExchange"
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: usersList
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/FilterUsername"
        - $ref: "#/components/parameters/FilterEmail"
        - $ref: "#/components/parameters/FilterUserGroup"
        - $ref: "#/components/parameters/FilterEnabled"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Users]
      summary: Create user (admin)
      operationId: usersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user
      operationId: usersGet
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [Users]
      summary: Update user
      operationId: usersUpdate
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Users]
      summary: Delete user (admin)
      operationId: usersDelete
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /me:
    get:
      tags: [Users]
      summary: Current user profile
      operationId: usersMe
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /me/settings:
    get:
      tags: [Settings]
      summary: All user settings
      operationId: userSettingsList
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /me/settings/{category}:
    put:
      tags: [Settings]
      summary: Create/update settings by category
      operationId: userSettingsUpsert
      parameters:
        - $ref: "#/components/parameters/Category"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Settings]
      summary: Delete settings by category
      operationId: userSettingsDelete
      parameters:
        - $ref: "#/components/parameters/Category"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /transactions:
    get:
      tags: [Transactions]
      summary: Transaction search (simple filters)
      operationId: transactionsList
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/FilterTransactionId"
        - $ref: "#/components/parameters/FilterSrcIp"
        - $ref: "#/components/parameters/FilterDstIp"
        - $ref: "#/components/parameters/FilterProtocol"
        - $ref: "#/components/parameters/FilterMethod"
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
              example:
                data:
                  items:
                    - id: 123
                      sid: "abc-123"
                      src_ip: "127.0.0.1"
                      dst_ip: "127.0.0.1"
                      method: "INVITE"
                      storage_lake: "homer_lake_hot"
                      storage_volume: "hot"
                  keys:
                    - id
                    - sid
                    - src_ip
                    - dst_ip
                    - method
                    - storage_lake
                    - storage_volume
                meta:
                  pagination:
                    limit: 50
                    total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /transactions/search:
    post:
      tags: [Transactions]
      summary: Advanced transaction search
      operationId: transactionsSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallSearchRequest"
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /transactions/messages:
    post:
      tags: [Transactions]
      summary: Transaction messages
      description: |
        Returns the SIP/RTCP/etc. rows that belong to the given session
        transaction.

        **Lua call-id correlation (optional).** If `coordinator.correlation.enable`
        is `true` in the server config, and a row exists in `correlation_scripts` with
        `type='correlation'`, `status=true` and `(hepid, profile)` matching the
        request's `proto_type` and `event_type` (e.g. `hepid=1, profile='call'`
        for SIP), the server passes the base rows to the Lua function
        `correlate(data, nodes)` defined in that script. Any additional
        `session_id` values the script returns are merged into the request
        and the expanded set is re-queried. Script failure is non-fatal: the
        endpoint falls back to the base result and logs a warning.
      operationId: transactionMessagesList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionSessionRequest"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /messages/{messageId}:
    get:
      tags: [Transactions]
      summary: Message by ID
      operationId: messagesGet
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /messages/{messageId}/decoded:
    get:
      tags: [Transactions]
      summary: Decoded message
      operationId: messagesGetDecoded
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Decoded message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDecodedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /transactions/qos:
    post:
      tags: [Transactions]
      summary: Transaction QoS
      operationId: transactionQosGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionSessionRequest"
      responses:
        "200":
          description: QoS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QosResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /exports:
    post:
      tags: [Exports]
      summary: Create export (PCAP/TEXT)
      operationId: exportsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "201":
          description: Export created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /exports/{exportId}:
    get:
      tags: [Exports]
      summary: Export status
      operationId: exportsGet
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /exports/{exportId}/download:
    get:
      tags: [Exports]
      summary: Download export file
      operationId: exportsDownload
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export file (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /imports/pcap:
    post:
      tags: [Imports]
      summary: Import PCAP
      operationId: importsPcapCreate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                override_to_current_time:
                  type: string
                  description: >
                    When "true" / "1" / "on", packet timestamps are remapped so the first
                    SIP frame is "now" and later frames keep the same deltas as in the capture.
                  enum: ["true", "false", "1", "0", "on", "off"]
                force_sip_table:
                  type: string
                  description: >
                    Optional. When set, every decoded SIP message is written to this logical
                    DuckLake table instead of auto-routing by method. Values: call, registration,
                    default; aliases: reg, register, hep_proto_1_call, 1_call, etc. Same as multipart field force_table.
                  example: registration
                force_table:
                  type: string
                  description: Alias of force_sip_table (same semantics).
      responses:
        "201":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboards:
    get:
      tags: [Dashboards]
      summary: List dashboards
      operationId: dashboardsList
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Dashboards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Dashboards]
      summary: Create dashboard
      operationId: dashboardsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboards/{dashboardId}:
    get:
      tags: [Dashboards]
      summary: Get dashboard
      operationId: dashboardsGet
      parameters:
        - $ref: "#/components/parameters/DashboardId"
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Dashboards]
      summary: Update dashboard
      operationId: dashboardsUpdate
      parameters:
        - $ref: "#/components/parameters/DashboardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Dashboards]
      summary: Delete dashboard
      operationId: dashboardsDelete
      parameters:
        - $ref: "#/components/parameters/DashboardId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /me/dashboards/reset:
    post:
      tags: [Dashboards]
      summary: Reset user dashboards
      operationId: dashboardsReset
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /mappings:
    get:
      tags: [Mappings]
      summary: List mappings
      operationId: mappingsList
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/FilterMappingProfile"
        - $ref: "#/components/parameters/FilterHepId"
        - $ref: "#/components/parameters/FilterHepAlias"
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Mappings]
      summary: Create mapping (admin)
      operationId: mappingsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /mappings/{mappingId}:
    get:
      tags: [Mappings]
      summary: Mapping by ID
      operationId: mappingsGet
      parameters:
        - $ref: "#/components/parameters/MappingId"
      responses:
        "200":
          description: Mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Mappings]
      summary: Update mapping (admin)
      operationId: mappingsUpdate
      parameters:
        - $ref: "#/components/parameters/MappingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Mappings]
      summary: Delete mapping (admin)
      operationId: mappingsDelete
      parameters:
        - $ref: "#/components/parameters/MappingId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /mappings/fields:
    get:
      tags: [Mappings]
      summary: Mapping fields by profile
      operationId: mappingsFieldsList
      parameters:
        - name: hepid
          in: query
          required: true
          schema:
            type: integer
        - name: profile
          in: query
          required: true
          schema:
            type: string
      responses:
