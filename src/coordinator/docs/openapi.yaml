  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
    DashboardId:
      name: dashboardId
      in: path
      required: true
      schema:
        type: string
    MappingId:
      name: mappingId
      in: path
      required: true
      schema:
        type: string
    HepsubId:
      name: hepsubId
      in: path
      required: true
      schema:
        type: string
    AliasId:
      name: aliasId
      in: path
      required: true
      schema:
        type: string
    AuthTokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    AgentSubId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
    Category:
      name: category
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      schema:
        type: integer
        format: int64
    To:
      name: to
      in: query
      required: false
      schema:
        type: integer
        format: int64
    PageLimit:
      name: page[limit]
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    PageCursor:
      name: page[cursor]
      in: query
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: "Sort, format: field or -field"
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    FilterTransactionId:
      name: filter[transaction_id]
      in: query
      required: false
      schema:
        type: string
    FilterSrcIp:
      name: filter[src_ip]
      in: query
      required: false
      schema:
        type: string
    FilterDstIp:
      name: filter[dst_ip]
      in: query
      required: false
      schema:
        type: string
    FilterProtocol:
      name: filter[protocol]
      in: query
      required: false
      schema:
        type: integer
    FilterMethod:
      name: filter[method]
      in: query
      required: false
      schema:
        type: string
    FilterUsername:
      name: filter[username]
      in: query
      required: false
      schema:
        type: string
    FilterEmail:
      name: filter[email]
      in: query
      required: false
      schema:
        type: string
    FilterUserGroup:
      name: filter[user_group]
      in: query
      required: false
      schema:
        type: string
    FilterEnabled:
      name: filter[enabled]
      in: query
      required: false
      schema:
        type: boolean
    FilterAlias:
      name: filter[alias]
      in: query
      required: false
      schema:
        type: string
    FilterIp:
      name: filter[ip]
      in: query
      required: false
      schema:
        type: string
    FilterCaptureId:
      name: filter[capture_id]
      in: query
      required: false
      schema:
        type: string
    FilterMappingProfile:
      name: filter[profile]
      in: query
      required: false
      schema:
        type: string
    FilterHepId:
      name: filter[hepid]
      in: query
      required: false
      schema:
        type: integer
    FilterHepAlias:
      name: filter[hep_alias]
      in: query
      required: false
      schema:
        type: string
    FilterTokenName:
      name: filter[name]
      in: query
      required: false
      schema:
        type: string
    FilterTokenActive:
      name: filter[active]
      in: query
      required: false
      schema:
        type: boolean
    FilterAgentType:
      name: filter[type]
      in: query
      required: false
      schema:
        type: string
    FilterAgentNode:
      name: filter[node]
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      deprecated: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    Cursor:
      name: cursor
      in: query
      required: false
      deprecated: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: https://api.homer/errors/invalid_argument
        title:
          type: string
          example: Invalid argument
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Field `from` must be <= `to`
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    Meta:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        message:
          type: string
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string
        total:
          type: integer
        has_more:
          type: boolean
    IdResponse:
      type: object
      properties:
        data:
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: sipcapture
        type:
          type: string
          description: Password backend — internal (DuckDB users / admin hash) or ldap when LDAP is enabled.
          enum: [internal, ldap]
          default: internal
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT token
            scope:
              type: string
              example: b9f6q23a-0bde-41ce-cd36-da3dbc17ea12
            user:
              type: object
              properties:
                admin:
                  type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
    OAuth2TokenExchange:
      type: object
      required: [token]
      properties:
        token:
          type: string
          example: token
    AuthProvidersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            internal:
              type: object
              properties:
                enable:
                  type: boolean
                name:
                  type: string
                position:
                  type: integer
                type:
                  type: string
            ldap:
              type: object
              properties:
                enable:
                  type: boolean
                name:
                  type: string
                position:
                  type: integer
                type:
                  type: string
            oauth2:
              type: array
              maxItems: 1
              description: At most one OAuth2 provider; coordinator config uses a single oauth2_provider object.
              items:
                type: object
                properties:
                  enable:
                    type: boolean
                  name:
                    type: string
                  position:
                    type: integer
                  provider_image:
                    type: string
                  provider_name:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                  auto_redirect:
                    type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
    UserCreate:
      type: object
      required: [username, partid, email, firstname, lastname, department, user_group]
      properties:
        username:
          type: string
        partid:
          type: integer
          example: 10
        email:
          type: string
        password:
          type: string
        name:
          type: string
          description: Display name (stored as users.full_name)
        enabled:
          type: boolean
        firstname:
          type: string
        lastname:
          type: string
        department:
          type: string
        user_group:
          type: string
    UserPatch:
      type: object
      properties:
        partid:
          type: integer
        email:
          type: string
        password:
          type: string
        name:
          type: string
          description: Display name (users.full_name)
        enabled:
          type: boolean
        firstname:
          type: string
        lastname:
          type: string
        department:
          type: string
        user_group:
          type: string
    User:
      type: object
      properties:
        guid:
          type: string
          example: e71771a2-1ea0-498f-8d27-391713e10664
        username:
          type: string
        name:
          type: string
          description: Display name
        partid:
          type: integer
        email:
          type: string
        enabled:
          type: boolean
        firstname:
          type: string
        lastname:
          type: string
        department:
          type: string
        user_group:
          type: string
    UserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/Meta"
    UserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/Meta"
    UserProfile:
      type: object
      properties:
        guid:
          type: string
        username:
          type: string
        display_name:
          type: string
        avatar:
          type: string
        group:
          type: string
        admin:
          type: boolean
        external_auth:
          type: boolean
        external_profile:
          type: string
    UserProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
        meta:
          $ref: "#/components/schemas/Meta"
    UserSetting:
      type: object
      properties:
        category:
          type: string
        data:
          $ref: "#/components/schemas/DashboardElement"
        guid:
          type: string
        id:
          type: integer
        param:
          type: string
        partid:
          type: integer
        user_name:
          type: string
    UserSettingUpsert:
      type: object
      required: [param, data]
      properties:
        category:
          type: string
        param:
          type: string
        data:
          type: object
    UserSettingListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserSetting"
        meta:
          $ref: "#/components/schemas/Meta"
    SearchObject:
      type: object
      properties:
        filter:
          type: object
          properties:
            proto_type:
              type: integer
              description: Protocol type (e.g. 1 for SIP)
            event_type:
              type: string
              description: Transaction/event type
              enum: [call, registration, rtp, rtcp, log]
            method:
              type: string
            call_id:
              type: string
            ruri_user:
              type: string
            from_user:
              type: string
            to_user:
              type: string
            user_agent:
              type: string
            src_ip:
              type: string
            dst_ip:
              type: string
            src_port:
              type: integer
            dst_port:
              type: integer
            capture_id:
              type: integer
            node:
              type: string
        param:
          type: object
          properties:
            transaction:
              type: object
            limit:
              type: integer
              example: 200
            search:
              type: object
              additionalProperties: true
            orlogic:
              type: boolean
            whitelist:
              type: array
              items:
                type: string
            location:
              type: object
              properties:
                node:
                  type: array
                  items:
                    type: string
            timezone:
              type: object
              properties:
                value:
                  type: integer
                name:
                  type: string
        timestamp:
          type: object
          properties:
            from:
              type: integer
              format: int64
              description: Unix epoch milliseconds (UTC).
            to:
              type: integer
              format: int64
              description: Unix epoch milliseconds (UTC).
    CallSearchRequest:
      $ref: "#/components/schemas/SearchObject"
    TransactionSessionRequest:
      type: object
      description: >
        Use session_id for one Call-ID, or session_ids (non-empty, max 50) for an OR filter across sessions.
        When session_ids is set it takes precedence over session_id. Supported on messages, qos, logs,
        callinfo, events, sub, hepsub, and export endpoints; responses include session_id on rows for grouping.
        For SIP call (proto_type=1, event_type=call), POST /transactions/callinfo returns one summary object per Call-ID
        (ringing_seconds, call_duration_seconds, codecs, UAC/UAS, setup delays, status, from_party, ruri_party,
        methods_distribution for the legacy methods chart, etc.).
      properties:
        session_id:
          type: string
          description: Session identifier to lookup messages/logs/QoS.
        session_ids:
          type: array
          maxItems: 50
          items:
            type: string
          description: Multiple Call-IDs (OR filter; B2B leg matching where applicable).
        proto_type:
          type: integer
          description: HEP protocol type (default 1).
        event_type:
          type: string
          description: Event type (call, registration, default).
        timestamp:
          type: object
          description: Optional millisecond UTC window (from/to).
          properties:
            from:
              type: integer
              format: int64
            to:
              type: integer
              format: int64
        whitelist:
          type: array
