name: Go Builder

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build requirements
      run: |
        sudo apt update && sudo apt install -y libluajit-5.1-dev

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.0'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build
      run: make release
